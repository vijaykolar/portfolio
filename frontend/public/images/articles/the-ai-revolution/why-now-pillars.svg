<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Three forces behind the AI revolution: data, compute, and better architectures.">
  <rect width="800" height="400" rx="16" fill="#F8FAFC"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="none" stroke="#E2E8F0"/>

  <text x="400" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,Arial" font-size="20" font-weight="700" fill="#0F172A">Three forces that came together</text>

  <!-- Data -->
  <g font-family="ui-sans-serif,system-ui,Arial">
    <rect x="52" y="100" width="216" height="240" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="160" cy="160" r="34" fill="#EEF2FF"/>
    <g fill="none" stroke="#4F46E5" stroke-width="3">
      <ellipse cx="160" cy="148" rx="20" ry="8"/>
      <path d="M140 148 v24 c0 4.4 9 8 20 8 s20 -3.6 20 -8 v-24"/>
      <path d="M140 160 c0 4.4 9 8 20 8 s20 -3.6 20 -8"/>
    </g>
    <text x="160" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Data</text>
    <text x="160" y="258" text-anchor="middle" font-size="13" fill="#475569">The internet gave us</text>
    <text x="160" y="277" text-anchor="middle" font-size="13" fill="#475569">huge sets of text,</text>
    <text x="160" y="296" text-anchor="middle" font-size="13" fill="#475569">images and code.</text>
  </g>

  <!-- Compute -->
  <g font-family="ui-sans-serif,system-ui,Arial">
    <rect x="292" y="100" width="216" height="240" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="400" cy="160" r="34" fill="#ECFEFF"/>
    <g fill="none" stroke="#0891B2" stroke-width="3">
      <rect x="384" y="146" width="32" height="28" rx="3"/>
      <path d="M390 146 v-8 M400 146 v-8 M410 146 v-8 M390 174 v8 M400 174 v8 M410 174 v8"/>
      <path d="M384 154 h-8 M384 164 h-8 M416 154 h8 M416 164 h8"/>
    </g>
    <text x="400" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Compute</text>
    <text x="400" y="258" text-anchor="middle" font-size="13" fill="#475569">Powerful GPUs made</text>
    <text x="400" y="277" text-anchor="middle" font-size="13" fill="#475569">training very large</text>
    <text x="400" y="296" text-anchor="middle" font-size="13" fill="#475569">models practical.</text>
  </g>

  <!-- Architecture -->
  <g font-family="ui-sans-serif,system-ui,Arial">
    <rect x="532" y="100" width="216" height="240" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="640" cy="160" r="34" fill="#F5F3FF"/>
    <g fill="none" stroke="#7C3AED" stroke-width="3">
      <circle cx="626" cy="150" r="5"/><circle cx="626" cy="172" r="5"/>
      <circle cx="654" cy="150" r="5"/><circle cx="654" cy="172" r="5"/>
      <path d="M631 150 h18 M631 172 h18 M630 154 l20 14 M650 154 l-20 14"/>
    </g>
    <text x="640" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Architecture</text>
    <text x="640" y="258" text-anchor="middle" font-size="13" fill="#475569">The transformer let</text>
    <text x="640" y="277" text-anchor="middle" font-size="13" fill="#475569">models understand</text>
    <text x="640" y="296" text-anchor="middle" font-size="13" fill="#475569">context far better.</text>
  </g>
</svg>
